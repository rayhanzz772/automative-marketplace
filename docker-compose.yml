version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────
  # App — Express API
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automotive-app
    ports:
      - '${APP_PORT:-8000}:8000'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automotive-net
    restart: unless-stopped

# PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: automotive-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-automative_marketplace}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-automative_marketplace}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - automotive-net
    restart: unless-stopped

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: automotive-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - automotive-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  automotive-net:
    driver: bridge
